<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sutli: close your perp when the odds turn</title>
    <meta name="description" content="Sutli closes your Jupiter perp position when a prediction market's odds cross your line, using one order you sign in advance. It can never move your funds." />
    <meta name="theme-color" content="#13100d" />
    <script>
      // Set the theme before first paint: saved choice, else the system setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem("sutli.theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Sutli: close your perp when the odds turn" />
    <meta property="og:description" content="Sign one close order in advance. When the odds cross your line, Sutli sends exactly that order and nothing else." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
